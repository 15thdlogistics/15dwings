
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Booking Wings</title>

  <style>
    /* Strict CSS Reset for OLED Pitch Black Execution */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #000000 !important;
      color: #000000;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 0 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Seamless Iframe with Zero Border or Outline */
    iframe#workerEmbed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0 !important;
      outline: none !important;
      margin: 0;
      padding: 0;
      display: block;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <iframe
    id="workerEmbed"
    src="https://bookingwings.15dwingsltd.workers.dev"
    title="Booking Wings"
    loading="eager"
    allow="clipboard-write; autoplay; payment; geolocation; microphone; camera; display-capture"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation allow-top-navigation-by-user-activation"
  ></iframe>

  <script>
    (function () {
      'use strict';

      var WORKER_ORIGIN = 'https://bookingwings.15dwingsltd.workers.dev';
      var frame = document.getElementById('workerEmbed');

      // Silently pass parent query parameters down to the worker frame if present
      try {
        if (window.location.search) {
          frame.src = WORKER_ORIGIN + window.location.search;
        }
      } catch (e) {}

      // Underground postMessage handling without console logs or DOM mutations
      window.addEventListener('message', function (event) {
        if (event.origin !== WORKER_ORIGIN) return;
        var data = event.data;
        if (!data || typeof data !== 'object') return;

        // Dynamic height adjustment if child requests it
        if (data.type === 'SET_HEIGHT' && data.height) {
          var targetHeight = parseInt(data.height, 10);
          if (!isNaN(targetHeight) && targetHeight > 0) {
            document.body.style.height = targetHeight + 'px';
            frame.style.height = targetHeight + 'px';
          }
        }

        // Silent scroll reset
        if (data.type === 'SCROLL_TOP') {
          window.scrollTo(0, 0);
        }
      }, false);
    })();
  </script>
</body>
</html>
